[project]
name = "lenora-backend"
version = "0.1.0"
description = "Reference backend for the Lenora Backend Protocol"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
testing = ["pytest>=8", "respx>=0.21"]

[project.scripts]
lenora-backend = "lenora_backend.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "lenora-adapter-cloudinary",
  "lenora-adapter-openai",
]

[tool.uv.workspace]
members = ["adapters/cloudinary", "adapters/openai"]

[tool.uv.sources]
lenora-adapter-cloudinary = { workspace = true }
lenora-adapter-openai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lenora_backend"]

[tool.pytest.ini_options]
testpaths = ["tests", "adapters/cloudinary/tests", "adapters/openai/tests"]
pythonpath = ["tests", "adapters/cloudinary/tests", "adapters/openai/tests"]
markers = ["live: hits the real provider; needs keys in the environment"]
addopts = "-m 'not live'"
