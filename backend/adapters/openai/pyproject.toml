[project]
name = "lenora-adapter-openai"
version = "0.1.0"
description = "OpenAI adapter for lenora-backend: voiceover and prompt rewriting"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["lenora-backend"]

[project.entry-points."lenora.adapters"]
openai = "lenora_adapter_openai:OpenAIAdapter"

[tool.uv.sources]
lenora-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lenora_adapter_openai"]
