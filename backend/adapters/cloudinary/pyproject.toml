[project]
name = "lenora-adapter-cloudinary"
version = "0.1.0"
description = "Cloudinary adapter for lenora-backend"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["lenora-backend"]

[project.entry-points."lenora.adapters"]
cloudinary = "lenora_adapter_cloudinary:CloudinaryAdapter"

[tool.uv.sources]
lenora-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lenora_adapter_cloudinary"]
