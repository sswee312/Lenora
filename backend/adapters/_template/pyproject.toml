[project]
name = "lenora-adapter-template"
version = "0.1.0"
description = "Copy this directory to start a Lenora backend adapter"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["lenora-backend"]

[project.entry-points."lenora.adapters"]
template = "lenora_adapter_template:TemplateAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lenora_adapter_template"]
